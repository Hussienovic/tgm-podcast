<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A08">
<title>TGM Podcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<!-- ============ LOBBY ============ -->
<main id="lobby" class="screen active">
  <div class="lobby-wrap">
    <div class="brand">
      <div class="onair-lamp" id="lobbyLamp"></div>
      <h1>TGM<br>Podcast</h1>
      <p class="tag">Private rooms for TGM Studio. Host a room, share the code, talk.</p>
    </div>

    <div class="lobby-card">
      <label class="field">
        <span>Your name</span>
        <input id="nameInput" type="text" maxlength="20" placeholder="e.g. Hocine" autocomplete="off">
      </label>

      <button id="hostBtn" class="btn primary">Host a room</button>

      <div class="divider"><span>or join a friend</span></div>

      <div class="join-row">
        <input id="codeInput" type="text" maxlength="9" placeholder="TGM-XXXX" autocomplete="off" spellcheck="false">
        <button id="joinBtn" class="btn">Join</button>
      </div>

      <p id="lobbyError" class="error" role="alert"></p>
    </div>
  </div>
</main>

<!-- ============ ROOM ============ -->
<main id="room" class="screen">
  <header class="room-top">
    <div class="live-badge"><i class="dot"></i><b>ON AIR</b></div>
    <div class="code-chip" id="codeChip" title="Tap to copy the room code">
      <span id="roomCodeText">TGM-----</span>
      <small>copy</small>
    </div>
    <div class="conn-state" id="connState">connecting…</div>
    <button id="statsBtn" class="icon-btn" title="Connection stats" aria-label="Toggle stats">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2" /></svg>
    </button>
  </header>

  <section class="stage">
    <div id="grid" class="grid"></div>
    <aside id="chatPanel" class="chat closed">
      <div class="chat-head">
        <b>Chat</b>
        <button id="chatClose" class="icon-btn small" aria-label="Close chat">✕</button>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" placeholder="Message the room" autocomplete="off" maxlength="300">
        <button class="btn small" type="submit">Send</button>
      </form>
    </aside>
  </section>

  <div id="statsPanel" class="stats hidden"></div>

  <footer class="dock">
    <button id="micBtn" class="dock-btn on" aria-label="Mute microphone">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
      <span>Mic</span>
    </button>
    <button id="camBtn" class="dock-btn" aria-label="Turn camera on">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg>
      <span>Camera</span>
    </button>
    <button id="shareBtn" class="dock-btn" aria-label="Share screen">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Share</span>
    </button>
    <button id="qualityBtn" class="dock-btn" aria-label="Screen quality">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>
      <span>Quality</span>
    </button>
    <button id="chatBtn" class="dock-btn" aria-label="Open chat">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12Z"/></svg>
      <span>Chat</span>
      <i id="chatBadge" class="badge hidden">0</i>
    </button>
    <button id="leaveBtn" class="dock-btn leave" aria-label="Leave room">
      <svg viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/></svg>
      <span>Leave</span>
    </button>
  </footer>

  <!-- Screen quality sheet -->
  <div id="qualitySheet" class="sheet hidden" role="dialog" aria-label="Screen share quality">
    <h3>Screen share quality</h3>
    <div class="opt-group" id="resGroup">
      <button data-res="720" class="opt">720p</button>
      <button data-res="1080" class="opt sel">1080p</button>
      <button data-res="1440" class="opt">1440p</button>
    </div>
    <div class="opt-group" id="fpsGroup">
      <button data-fps="30" class="opt">30 fps</button>
      <button data-fps="60" class="opt sel">60 fps</button>
    </div>
    <div class="opt-group" id="modeGroup">
      <button data-mode="motion" class="opt sel">Game (smooth)</button>
      <button data-mode="detail" class="opt">Text / code (sharp)</button>
    </div>
    <label class="field inline">
      <span>Max bitrate <b id="brLabel">8</b> Mbps</span>
      <input id="brRange" type="range" min="2" max="20" value="8">
    </label>
    <p class="hint">Applies the next time you start sharing. Lower it if viewers see stutter.</p>
    <button id="qualityClose" class="btn small">Done</button>
  </div>
</main>

<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
